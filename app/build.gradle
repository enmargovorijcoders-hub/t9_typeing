plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simple.t9keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.simple.t9keyboard"
        minSdk 14
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
