plugins {
    id 'com.android.application'
}

android {
    namespace 'com.enmar.t9'
    compileSdk 34

    defaultConfig {
        applicationId "com.enmar.t9"
        minSdk 14
        targetSdk 34
        versionCode 2
        versionName "2.0"
        vectorDrawables.useSupportLibrary = false
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
